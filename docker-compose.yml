services:
  yfs-webui:
    image: rjyspl/yfs-ui:latest
    container_name: yfs-ui
    # Runtime config (VITE_API_URL, VITE_SSO_URL, ...); see apps/web/.env.example.
    env_file:
      - .env
    ports:
      - '127.0.0.1:3000:3000'
    restart: always
