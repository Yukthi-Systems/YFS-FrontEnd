name: Docker Build and Deploy

# Push-only: uses registry secrets, so it must never run for pull requests.
on:
  push:
    branches:
      - "main"
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine Docker tag
        id: tag
        run: echo "TAG=$(echo $GITHUB_REF | cut -d'/' -f3)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          tags: |
            rjyspl/yfs-ui:latest
            rjyspl/yfs-ui:${{ steps.tag.outputs.TAG }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh -o StrictHostKeyChecking=no root@$SERVER_IP << 'EOF'
            set -e
            cd /srv/yfs-ui
            # The image has no URLs baked in; without runtime config the app can't reach the API.
            test -f .env || { echo "Missing /srv/yfs-ui/.env"; exit 1; }
            grep -q "env_file" docker-compose.y*ml || { echo "docker-compose on the server has no env_file: .env"; exit 1; }
            docker compose pull
            docker compose up -d
            docker ps
          EOF
