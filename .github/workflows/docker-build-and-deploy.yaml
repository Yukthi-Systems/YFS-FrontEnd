name: Docker Build and Deploy

on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: Het-8v-16G
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine Docker tag
        id: tag
        run: echo "TAG=$(echo $GITHUB_REF | cut -d'/' -f3)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          tags: |
            rjyspl/yfs-ui:latest
            rjyspl/yfs-ui:${{ steps.tag.outputs.TAG }}

  deploy:
    needs: build
    runs-on: Het-8v-16G
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          # Copy the docker-compose.yaml file to the server (Replace with existing file)
          # TODO: Uncomment the below line for production deployment based on the tag on push
          # scp -o StrictHostKeyChecking=no docker-compose.yaml root@$SERVER_IP:/srv/yfs-ui/docker-compose.yaml

          # Connect and restart the service
          ssh -o StrictHostKeyChecking=no root@$SERVER_IP << 'EOF'
            cd /srv/yfs-ui
            docker compose pull
            docker compose up -d
            docker ps
          EOF
